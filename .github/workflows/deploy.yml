name: Deploy (captadel)

# Deploys Captain Adel (captadel.com) to Cloud Run on push to main. The deploy
# job is gated on the GCP_SA_KEY secret: until it is set in this repo's Actions
# secrets, the build/test job runs and the deploy step skips with a warning.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      region:
        description: 'Cloud Run region (me-central2 default; me-central1 fallback)'
        default: 'me-central2'

permissions:
  contents: read

concurrency:
  group: deploy-captadel
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run smoke
      - run: npm run smoke:frontend
      - run: npm run test:unit
      - run: npm run eval:dry

  deploy:
    needs: test
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      REGION: ${{ github.event.inputs.region || vars.CAPTADEL_REGION || 'me-central2' }}
      # Optional Slack deploy alerts (see Office/06-operations-it/slack-best-practices.md §8.1).
      # No-op until the SLACK_WEBHOOK_URL secret is set in this repo's Actions secrets.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: Skip when GCP_SA_KEY is not configured
        if: ${{ env.GCP_SA_KEY == '' }}
        run: |
          echo "::warning::Deploy skipped — GCP_SA_KEY secret not configured"
          echo "⚠️ Deploy skipped — GCP_SA_KEY secret not configured" >> "$GITHUB_STEP_SUMMARY"

      - name: Authenticate to Google Cloud
        if: ${{ env.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        if: ${{ env.GCP_SA_KEY != '' }}
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.CAPTADEL_PROJECT_ID }}

      - name: Deploy to Cloud Run (deploy.sh is the source of truth)
        if: ${{ env.GCP_SA_KEY != '' }}
        run: ./deploy/deploy.sh

      - name: Health check
        if: ${{ env.GCP_SA_KEY != '' }}
        run: |
          URL="$(gcloud run services describe captadel --region "$REGION" --format='value(status.url)')"
          echo "Service URL: $URL"
          curl -fsS "$URL/health" | grep '"status":"ok"'
          echo "✅ Deployed and healthy: $URL" >> "$GITHUB_STEP_SUMMARY"

      # Optional: post the deploy result to Slack. Gated on the SLACK_WEBHOOK_URL
      # secret (mapped to job env above) so it silently no-ops until configured.
      # Interpolated GitHub context values pass through env vars (never inlined
      # into the run script) to avoid expression injection.
      - name: Notify Slack (deploy result)
        if: ${{ always() && env.SLACK_WEBHOOK_URL != '' }}
        env:
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(printf '{"text": "*%s* deploy on `%s` → *%s* (<%s|run>)"}' \
            "$REPO" "$REF_NAME" "$JOB_STATUS" "$RUN_URL")
          curl -fsS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$payload"
